services:
  - type: web
    runtime: docker
    name: rmap-api
    dockerfilePath: docker/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: APP
        value: api
      - key: CLIENT_URL
        sync: false
      - key: CALL_BACK_URL_BASE
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_REFRESH_TOKEN_HASH_SECRET
        sync: false
      - key: PASSWORD_RESET_TOKEN_HASH_SECRET
        sync: false
      - key: PASSWORD_RESET_TOKEN_TTL_MINUTES
        sync: false
      - key: PASSWORD_RESET_FRONTEND_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_CALLBACK_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EVALUATOR_URL
        sync: false
      - key: EVALUATOR_SHARED_SECRET
        sync: false

  - type: web
    runtime: docker
    name: rmap-evaluator
    dockerfilePath: docker/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: APP
        value: evaluator
      - key: EVALUATOR_SHARED_SECRET
        sync: false
